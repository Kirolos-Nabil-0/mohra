name: Build & Release Windows Package

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as official GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore configuration from secrets
        env:
          CONFIG_PY: ${{ secrets.CONFIG_PY }}
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        shell: python
        run: |
          import os, shutil

          # Restore config.py
          cfg_py = os.environ.get('CONFIG_PY')
          if cfg_py and cfg_py.strip():
              with open('config.py', 'w', encoding='utf-8') as f:
                  f.write(cfg_py)
              print("Successfully restored config.py from secrets.")
          elif os.path.exists('config.example.py'):
              shutil.copyfile('config.example.py', 'config.py')
              print("Notice: CONFIG_PY secret not found; used config.example.py fallback.")
          else:
              print("Warning: Neither CONFIG_PY secret nor config.example.py was found.")

          # Restore config.json
          cfg_json = os.environ.get('CONFIG_JSON')
          if cfg_json and cfg_json.strip():
              with open('config.json', 'w', encoding='utf-8') as f:
                  f.write(cfg_json)
              print("Successfully restored config.json from secrets.")
          elif os.path.exists('config.example.json'):
              shutil.copyfile('config.example.json', 'config.json')
              print("Notice: CONFIG_JSON secret not found; used config.example.json fallback.")
          else:
              print("Warning: Neither CONFIG_JSON secret nor config.example.json was found.")

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Read Application Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('version.json')).get('version', '1.0.0'))")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Icon if missing
        run: |
          python -c "import os; from PIL import Image, ImageDraw; os.makedirs('assets', exist_ok=True); img = Image.new('RGBA', (256, 256), (0, 0, 0, 0)); dc = ImageDraw.Draw(img); dc.ellipse([16, 16, 240, 240], fill=(0, 168, 204, 255), outline=(255, 255, 255, 255), width=8); p = [(64, 180), (64, 82), (128, 138), (192, 82), (192, 180)]; dc.line(p, fill=(255, 255, 255, 255), width=16); img.save('assets/app.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean mohra.spec

      - name: Prepare Distribution Folders
        run: |
          if (!(Test-Path "dist\Mohra\logs")) { New-Item -ItemType Directory -Path "dist\Mohra\logs" }
          if (!(Test-Path "dist\Mohra\cache")) { New-Item -ItemType Directory -Path "dist\Mohra\cache" }
          if (!(Test-Path "dist\Mohra\chrome_profile")) { New-Item -ItemType Directory -Path "dist\Mohra\chrome_profile" }
          if (Test-Path "config.json") {
            Copy-Item "config.json" -Destination "dist\Mohra\config.json" -Force
          } elseif (Test-Path "config.example.json") {
            Copy-Item "config.example.json" -Destination "dist\Mohra\config.json" -Force
          }

      - name: Package Standalone ZIP
        run: |
          Compress-Archive -Path "dist\Mohra\*" -DestinationPath "dist\Mohra-Windows.zip" -Force

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows Installer (.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.VERSION }} installer.iss

      - name: Upload Standalone ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mohra-Standalone-Windows
          path: dist/Mohra-Windows.zip
          retention-days: 14

      - name: Upload Setup Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mohra-Setup-Installer
          path: dist/Installer/*.exe
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: ${{ format('Mohra Automation v{0}', env.VERSION) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Mohra-Windows.zip
            dist/Installer/*.exe
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
